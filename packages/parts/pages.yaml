# The page engine for the bar buttons.
#
# A page is six buttons. Drawing one means calling bp_button six times; pressing
# one looks up what that slot was given and either navigates or fires an event.
# All of it happens on the device, so paging is immediate and keeps working with
# Home Assistant unreachable.
#
# This file is deliberately generic -- it knows that pages exist, not which ones.
# Your own yaml must provide two things:
#
#   bp_events       an event entity, listing every event name its pages fire
#   bp_render_page  a script taking `page: string` that calls bp_button for
#                   each slot that page uses
#
# See docs/contract.md.
#
# Slot 4 (bar 3 left, bottom left) is the navigation slot. On any page other
# than the home page it is filled with a back button before bp_render_page runs,
# so pages do not declare it -- though a page may still overwrite it if it wants
# that position for something else.
substitutions:
  bp_home_page: home
  bp_title_color: grey
  bp_back_title: Back
  bp_back_icon: arrow-left
  bp_back_color: grey

esphome:
  on_boot:
    # After LVGL has built its widgets; an update aimed at a widget that does
    # not exist yet is silently lost.
    - priority: -100
      then:
        - script.execute:
            id: bp_show
            page: ${bp_home_page}

script:
  # Dispatches to the panel that owns this slot. The per-panel scripts are
  # generated by the bar_content fragment, one per display, because an LVGL
  # action needs a widget id known at compile time.
  - id: bp_button
    mode: restart
    parameters:
      slot: int
      title: string
      icon: string
      color: string
      title_color: string
      event: string
      hold: string
      go: string
    then:
      - lambda: |-
          switch (slot) {
            case 0: id(bp_slot0)->execute(title, icon, color, title_color, event, hold, go); break;
            case 1: id(bp_slot1)->execute(title, icon, color, title_color, event, hold, go); break;
            case 2: id(bp_slot2)->execute(title, icon, color, title_color, event, hold, go); break;
            case 3: id(bp_slot3)->execute(title, icon, color, title_color, event, hold, go); break;
            case 4: id(bp_slot4)->execute(title, icon, color, title_color, event, hold, go); break;
            case 5: id(bp_slot5)->execute(title, icon, color, title_color, event, hold, go); break;
            default: break;
          }

  # Two shorthands over bp_button, because ESPHome scripts have no default
  # parameter values -- every call has to spell out every parameter, so a
  # single eight-parameter script makes a page definition unreadable. These
  # two cover what buttons actually are: one goes somewhere, the other does
  # something. Reach for bp_button directly for a hold action or a title in a
  # colour other than the default.
  - id: bp_nav
    mode: restart
    parameters:
      slot: int
      title: string
      icon: string
      color: string
      go: string
    then:
      - lambda: |-
          id(bp_button)->execute(slot, title, icon, color, "${bp_title_color}", "", "", go);

  - id: bp_act
    mode: restart
    parameters:
      slot: int
      title: string
      icon: string
      color: string
      event: string
    then:
      - lambda: |-
          id(bp_button)->execute(slot, title, icon, color, "${bp_title_color}", event, "", "");

  - id: bp_show
    mode: restart
    parameters:
      page: string
    then:
      - lambda: |-
          button_plus::current_page() = page;
          // Blank everything first so a page only has to declare what it uses.
          for (int i = 0; i < 6; i++)
            id(bp_button)->execute(i, "", "", "", "", "", "", "");
          if (page != "${bp_home_page}")
            id(bp_button)->execute(4, "${bp_back_title}", "${bp_back_icon}",
                                   "${bp_back_color}", "${bp_back_color}",
                                   "", "", "${bp_home_page}");
          id(bp_render_page)->execute(page);
          // Push all six panels out here, back to back, rather than leaving
          // each to its own 16ms refresh timer. Six displays on one SPI bus can
          // never change at the same instant -- they are selected one at a time
          // -- so the best available is a tight burst with nothing interleaved.
          // Left to the timers, other loop work lands between panels and the
          // sweep is visibly slower.
          lv_refr_now(id(bar1_left_lvgl)->get_disp());
          lv_refr_now(id(bar1_right_lvgl)->get_disp());
          lv_refr_now(id(bar2_left_lvgl)->get_disp());
          lv_refr_now(id(bar2_right_lvgl)->get_disp());
          lv_refr_now(id(bar3_left_lvgl)->get_disp());
          lv_refr_now(id(bar3_right_lvgl)->get_disp());

  - id: bp_press
    mode: parallel
    parameters:
      slot: int
    then:
      - if:
          condition:
            lambda: 'return !button_plus::slots()[slot].go.empty();'
          then:
            - lambda: 'id(bp_show)->execute(button_plus::slots()[slot].go);'
          else:
            - if:
                condition:
                  lambda: 'return !button_plus::slots()[slot].event.empty();'
                then:
                  - event.trigger:
                      id: bp_events
                      event_type: !lambda 'return button_plus::slots()[slot].event;'

  - id: bp_hold
    mode: parallel
    parameters:
      slot: int
    then:
      - if:
          condition:
            lambda: 'return !button_plus::slots()[slot].hold.empty();'
          then:
            - event.trigger:
                id: bp_events
                event_type: !lambda 'return button_plus::slots()[slot].hold;'
